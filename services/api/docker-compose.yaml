version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
      args:
        - APP_ENV=${APP_ENV}
        - APP_URL=${APP_URL}
    container_name: laravel_app
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "8080:80"
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: laravel_pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: laravel
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
